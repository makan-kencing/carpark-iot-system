[project]
name = "carpark-iot-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "RPi.GPIO",
    "gpiozero",
    "picamera2",
    "opencv-python>=4.13.0.92",
    "fast-alpr[onnx]",
    "pydantic",
    "paho-mqtt",
    "sqlalchemy",
    "sqlalchemy-timescaledb",
    "asyncpg",
    "pyrebase"
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"