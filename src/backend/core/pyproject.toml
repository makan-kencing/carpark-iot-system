[project]
name = "carpark-iot-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "RPi.GPIO",
    "gpiozero",
    "picamera2",
    "opencv-contrib-python-headless",
    "fast-alpr[onnx]",
    "pydantic",
    "paho-mqtt",
    "sqlalchemy",
    "sqlalchemy-timescaledb",
    "psycopg2-binary",
    "firebase-admin"
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"