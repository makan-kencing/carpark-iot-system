{% for entry in entries %}
    {% if loop.last and not loop.first %}
        <tr hx-get="/hx-entry?cursor={{ entry.timestamp.timestamp() }}"
            hx-trigger="revealed"
            hx-swap="afterend">
            {% include "__entry_row.html" %}
        </tr>
    {% else %}
        <tr>
            {% include "__entry_row.html" %}
        </tr>
    {% endif %}
{% endfor %}
