{% for entry in entries %}
    {% if loop.last %}
        <tr hx-get="/hx-entry?cursor={{ entry.timestamp.timestamp() }}"
            hx-trigger="revealed"
            hx-swap="afterend">
            <td>{{ entry.timestamp.isoformat() }}</td>
            <td>{{ entry.license_plate }}</td>
            <td>{{ entry.gate_id }}</td>
            <td>{{ entry.type.name }}</td>
            {% if entry.price %}
                <td>{{ entry.price }}</td>
            {% else %}
                <td></td>
            {% endif %}
        </tr>
    {% else %}
        {% include "_entry.html" %}
    {% endif %}
{% endfor %}
