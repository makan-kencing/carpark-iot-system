<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Carpark System</title>

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
            integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="">
    <img src="/camera/live.mjpg" alt="" class="img-fluid">
</div>

<form hx-post="/hx-wallet/deposit">
    <div class="input-group">
        <label for="nfc_id" class="input-group-text"></label>
        {% for _ in range(10) %}
            <input type="number" name="nfc_id" id="nfc_id" min="0" max="255" step="1" class="form-control">
        {% endfor %}
    </div>

    <div class="input-group">
        <label for="amount">RM</label>
        <input type="number" name="amount" id="amount" min="0" step="0.01" class="form-control">
    </div>

    <button type="submit">Deposit</button>
</form>

<table class="table table-striped">
    <thead>
    <tr>
        <th scope="col">Timestamp</th>
        <th scope="col">License Plate</th>
        <th scope="col">Gate</th>
        <th scope="col">Type</th>
        <th scope="col">Price</th>
    </tr>
    </thead>
    <!--suppress HtmlUnknownAttribute -->
    <tbody hx-get="/hx-entry" hx-trigger="load" hx-swap="afterbegin"
           hx-ext="sse" sse-connect="/hx-entry/stream" sse-swap="entryupdate"
           class="table-hover">
    </tbody>
</table>

<table class="table table-striped">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">NFC ID</th>
        <th scope="col">Balance</th>
    </tr>
    </thead>
    <tbody hx-get="/hx-wallet" hx-trigger="load, update-wallet from:body" hx-swap="innerHTML"
           class="table-hover">
    </tbody>
</table>
</body>
</html>
